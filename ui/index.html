<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hidework</title>
  </head>
  <body>
    <header class="menubar">
      <div class="brand"><img src="/seal.png" alt="" /><span class="title">Hidework</span></div>
      <nav id="menus" class="menus"></nav>
      <div class="spacer"></div>
      <div class="menubar-actions">
        <select id="page-size" title="Paper size for printing">
          <option value="letter">Letter</option>
          <option value="a4">A4</option>
        </select>
        <button class="btn" id="btn-print" type="button" title="Print the true-scale template (Ctrl+P)">Print</button>
        <button class="btn sim-toggle" id="btn-sim" type="button" title="Simulate (Space)"><span class="dot"></span>Simulate</button>
      </div>
    </header>
    <main class="workspace">
      <aside id="library" class="dock left"></aside>
      <section class="window w3d">
        <div class="win-head">
          <span class="win-title">3D</span>
          <div id="tb3d" class="win-toolbar"></div>
        </div>
        <div id="view3d" class="win-body"></div>
        <div id="hud3d" class="hud"></div>
      </section>
      <div class="splitter" id="splitter" title="Drag to resize"></div>
      <section class="window w2d">
        <div class="win-head">
          <span class="win-title">2D</span>
          <div id="tb2d" class="win-toolbar"></div>
        </div>
        <div id="stage" class="win-body"><canvas id="canvas" tabindex="0"></canvas></div>
      </section>
      <aside class="dock right">
        <div id="browser" class="browser"></div>
        <div id="inspector" class="property-editor"></div>
      </aside>
    </main>
    <footer class="statusbar"><span id="status"></span><span id="info"></span></footer>
    <div id="menu" class="menu hidden"></div>
    <div id="modal" class="modal hidden"></div>
    <div id="fabric-test" class="modal hidden">
      <div class="fabric-card">
        <div class="fabric-head"><h2>Fabric test</h2><button class="btn icon" id="fabric-close" type="button" title="Close">✕</button></div>
        <div class="fabric-body">
          <div id="fabric-controls" class="fabric-controls"></div>
          <div id="drape-view" class="fabric-view"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
