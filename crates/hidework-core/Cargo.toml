[package]
name = "hidework-core"
description = "Pattern geometry, fold compensation, stitching and template export for leather goods"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Parallel solver stages (MIT/Apache-2.0).
rayon = "1"
# Pattern import (WP2): SVG via roxmltree (MIT/Apache-2.0), vector PDF via lopdf (MIT),
# photo tracing via image (MIT/Apache-2.0, PNG and JPEG decoders only).
roxmltree = "0.21"
lopdf = { version = "0.47", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
