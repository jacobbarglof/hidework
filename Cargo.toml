[workspace]
members = ["crates/hidework-core", "crates/hidework-mcp", "crates/hidework-gpu", "src-tauri"]
resolver = "2"

# The simulator is far too slow unoptimised; keep it fast in dev builds and tests.
[profile.dev.package.hidework-core]
opt-level = 3

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
